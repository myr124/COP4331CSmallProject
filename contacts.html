<!DOCTYPE html>
<html>
<html lang="en">
<head>
	<title>Shark's Cove | Contacts</title>
	<script type="text/javascript" src="js/md5.js"></script>
	<script type="text/javascript" src="js/code.js"></script>
    <link href="styles.css" rel="stylesheet">	
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
</head>
<body onload="loadContacts()">

<div class="bubbles-container">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<h1 id="title">Shark's Cove</h1>


<div id="contactListDiv" role="main">
	<input type="text" id="searchName" onkeyup="searchContact()" placeholder="Search the cove...">
    <ul id="myUL">
    </ul>
</div>

<div id="addContactDiv">
    <span id="inner-title">Add Contact</span>
    <input type="text" id="firstName" placeholder="First Name" required>
    <input type="text" id="lastName" placeholder="Last Name" required>
    <input type="text" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone">
    <button class="submit-btn" onclick="addContact()">Add Contact</button>
    <span id="addContactResult"></span>
</div>
<button id="logoutButton" class="submit-btn" onclick="doLogout()">Logout</button>
</body>

</html>
