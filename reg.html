<!DOCTYPE html>
<html>
<html lang="en">
<head>
    <title>Shark's Cove | Register</title>
    <script type="text/javascript" src="js/md5.js"></script>
	<script type="text/javascript" src="js/code.js"></script>
    <link href="styles.css" rel="stylesheet">	
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1 id="title">Shark's Cove</h1>
    <div id="regDiv" role="main">
        <span id="inner-title">REGISTRATION</span>
        <form id="regForm" onsubmit="doRegister(); return false;">
            <div>
                <input type="submit" value="Back" class="submit-btn top-btn" onclick="window.location.href='index.html'">
            </div>
            <div class="form-row">
                <label for="registerEmail" class="reg-label narrow-label">Username:</label>
                <input type="text" id="registerEmail" class="reg-input" placeholder="Username">
            </div>
            <div class="form-row">
                <label for="registerPassword" class="reg-label">Password:</label>
                <input type="password" id="registerPassword" class="reg-input" required placeholder="Password">
            </div>
            <div class="form-row">
                <label for="registerFirstName" class="reg-label">First Name:</label>
                <input type="text" id="registerFirstName" class="reg-input" required placeholder="First Name">
            </div>
            <div class="form-row">
                <label for="registerLastName" class="reg-label">Last Name:</label>
                <input type="text" id="registerLastName" class="reg-input" required placeholder="Last Name">
            </div>
            <input type="submit" id="regSubmit" value="Register" class="submit-btn">
        </form>
    </div>
    <div id="registerResult"></div>
</body>
</html>
